# Alembic config for ad-hoc use (`alembic upgrade head`). The database URL is
# taken from DNDLABS_DATABASE_URL; `dnd-pipeline init-db` does the same thing.
[alembic]
script_location = src/dndlabs/storage/migrations
path_separator = os

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
