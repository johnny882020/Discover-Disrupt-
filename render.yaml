# Render Blueprint: https://render.com/docs/blueprint-spec
# Deploys the API (Docker) and a managed PostgreSQL database.
services:
  - type: web
    name: dndlabs-api
    runtime: docker
    dockerfilePath: ./docker/Dockerfile
    dockerContext: .
    plan: free            # upgrade to "starter" to avoid cold starts
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DNDLABS_DATABASE_URL
        fromDatabase:
          name: dndlabs-db
          property: connectionString
      - key: DNDLABS_AUTO_CREATE_SCHEMA
        value: "false"    # schema is managed by Alembic (dnd-pipeline init-db)
      - key: DNDLABS_EXPORT_DIR
        value: /app/exports
      - key: DNDLABS_LOG_LEVEL
        value: INFO

databases:
  - name: dndlabs-db
    databaseName: dndlabs
    user: dndlabs
    plan: free            # free Render Postgres expires after 30 days
