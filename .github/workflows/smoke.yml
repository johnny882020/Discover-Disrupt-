name: Smoke test

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Base URL of the deployed API
        required: true
        default: https://dndlabs-api.onrender.com

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install client dependencies
        run: pip install httpx typer
      - name: Run smoke test
        env:
          BASE_URL: ${{ inputs.base_url }}
          # A repository secret, not a workflow input: dispatch inputs are
          # shown unmasked in the run's UI and event payload.
          DNDLABS_ADMIN_BOOTSTRAP_SECRET: ${{ secrets.DNDLABS_ADMIN_BOOTSTRAP_SECRET }}
        run: |
          if [ -z "$DNDLABS_ADMIN_BOOTSTRAP_SECRET" ]; then
            echo "::error::Set the DNDLABS_ADMIN_BOOTSTRAP_SECRET repository secret (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          python scripts/smoke_test.py "$BASE_URL"
