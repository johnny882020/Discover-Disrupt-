name: Smoke test

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Base URL of the deployed API
        required: true
        default: https://dndlabs-api.onrender.com

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install client dependencies
        run: pip install httpx typer
      - name: Run smoke test
        env:
          BASE_URL: ${{ inputs.base_url }}
          # API keys of two dedicated smoke-test organizations, as repository
          # secrets (never workflow inputs, which GitHub shows unmasked). Not
          # the admin secret: these keys reach only those organizations.
          DNDLABS_SMOKE_API_KEY: ${{ secrets.DNDLABS_SMOKE_API_KEY }}
          DNDLABS_SMOKE_ISOLATION_API_KEY: ${{ secrets.DNDLABS_SMOKE_ISOLATION_API_KEY }}
        run: |
          if [ -z "$DNDLABS_SMOKE_API_KEY" ] || [ -z "$DNDLABS_SMOKE_ISOLATION_API_KEY" ]; then
            echo "::error::Set the DNDLABS_SMOKE_API_KEY and DNDLABS_SMOKE_ISOLATION_API_KEY repository secrets; see docs/deployment.md#smoke-test-on-demand."
            exit 1
          fi
          python scripts/smoke_test.py "$BASE_URL"
