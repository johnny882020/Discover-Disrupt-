name: Smoke test

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Base URL of the deployed API
        required: true
        default: https://dndlabs-api.onrender.com
      admin_secret:
        description: DNDLABS_ADMIN_BOOTSTRAP_SECRET of the deployed API
        required: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install client dependencies
        run: pip install httpx typer
      - name: Run smoke test
        env:
          BASE_URL: ${{ inputs.base_url }}
          ADMIN_SECRET: ${{ inputs.admin_secret }}
        run: python scripts/smoke_test.py "$BASE_URL" --admin-secret "$ADMIN_SECRET"
